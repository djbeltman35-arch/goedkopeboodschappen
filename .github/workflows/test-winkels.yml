name: Test winkels
on:
  push:
    branches: [test-winkels]
    paths: ['probe/*.mjs']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node probe/probe.mjs || true
      - run: |
          git config user.name test-bot; git config user.email test-bot@users.noreply.github.com
          git add probe/*.json; git commit -m "test uitvoer [skip netlify]" || true; git pull --rebase -q || true; git push
