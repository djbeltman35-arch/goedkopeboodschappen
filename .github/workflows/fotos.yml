name: Foto's zoeken
on:
  push:
    branches: [fotos]
    paths: [scripts/fotos_zoeken.py, .github/workflows/fotos.yml]
permissions:
  contents: write
jobs:
  zoeken:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/fotos_zoeken.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos-kandidaten && git commit -m "Fotokandidaten" && git push
