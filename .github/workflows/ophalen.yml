name: Prijzen ophalen

# Elke ochtend Aldi-assortiment en aanbiedingen ophalen en in data/ zetten.
# De site leest data/*.json rechtstreeks van raw.githubusercontent.com.
# Netlify-credits: alleen de commit van woensdag start een build (maandag bouwt de weekmenu-workflow al);
# de andere dagen "[skip netlify]" - de app toont nieuwe prijzen toch, want die komen live van GitHub.
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ophalen
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ophalen
        run: node ophalen/ophalen.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Afbeeldingen voor sociale media
        run: |
          pip install --quiet pillow
          python3 scripts/social.py || echo "social mislukt, prijzen worden wel opgeslagen"
      - name: Prijsgeschiedenis
        run: |
          curl -fsSL --max-time 180 -o /tmp/supermarkets.json https://raw.githubusercontent.com/supermarkt/checkjebon/main/data/supermarkets.json \
            && python3 scripts/historie.py bijwerken /tmp/supermarkets.json || echo "geschiedenis mislukt"
      - name: Opslaan
        run: |
          git config user.name "prijzen-bot"
          git config user.email "prijzen-bot@users.noreply.github.com"
          SKIP=" [skip netlify]"
          if [ "$(TZ=Europe/Amsterdam date +%u)" = "3" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then SKIP=""; fi
          git add data
          git diff --cached --quiet || git commit -m "Prijzen bijgewerkt $(date -u +%F)$SKIP"
          git pull --rebase -X theirs origin main
          git push
      - name: Pagina's melden bij Bing (IndexNow)
        run: |
          sleep 240
          python3 scripts/indexnow.py || echo "IndexNow mislukt"
