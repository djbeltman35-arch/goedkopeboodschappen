[build]
  command = "bash scripts/build.sh public"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://gc.zgo.at; worker-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' data: blob: https://raw.githubusercontent.com https://goedkopeboodschappen.goatcounter.com https://overpass-api.de https://overpass.kumi.systems https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/producten.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/producten-kern.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/winkels.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/producten-rest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/stijl.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/maaltijden-foto/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/maaltijden-img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Het oude netlify-adres stuurt door naar de eigen domeinnaam (alle pagina's, met behoud van het pad).
[[redirects]]
  from = "https://goedkopeboodschappen.netlify.app/*"
  to = "https://boodschappenvergelijk.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/aanbiedingen/albert-heijn/*"
  to = "/aanbiedingen/ah/"
  status = 301

