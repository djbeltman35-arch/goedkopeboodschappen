[build]
  command = "bash scripts/build.sh public"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/producten.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/producten-kern.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/producten-rest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/stijl.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/maaltijden-foto/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/maaltijden-img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/aanbiedingen/albert-heijn/*"
  to = "/aanbiedingen/ah/"
  status = 301

